# =====================================================================
# QueueLess backend configuration
#
# Secrets are NOT stored here. Put them in a ".env" file next to pom.xml
# (git-ignored; see .env.example) or set them as environment variables.
# =====================================================================

spring.application.name=queue-management-backend
spring.config.import=optional:file:.env[.properties]

# Authentication is JWT-based (AuthService checks passwords itself), so Spring Security's default
# in-memory user ("Using generated security password ...") is not needed
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------- Server ----------
server.port=${SERVER_PORT:8081}
# Optional HTTPS: set SSL_ENABLED=true and provide a PKCS12 keystore
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:classpath:localhost.p12}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# ---------- MongoDB ----------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/queue_management_db}
spring.data.mongodb.auto-index-creation=true

# ---------- Jackson ----------
# Jackson 3 (Spring Boot 4) writes java.time values as ISO-8601 strings by default

# ---------- JWT ----------
# JWT_SECRET is required and must be at least 32 bytes (e.g. `openssl rand -base64 64`)
jwt.secret=${JWT_SECRET}
# 24 hours by default
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Mail (Gmail SMTP; use an App Password) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ---------- Razorpay ----------
razorpay.key=${RAZORPAY_KEY:}
razorpay.secret=${RAZORPAY_SECRET:}

# ---------- Firebase (optional, push notifications) ----------
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}

# ---------- Logging ----------
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.messaging.simp=WARN
logging.level.org.springframework.web.socket=WARN

# ---------- Rate limiting (ISO-8601 durations) ----------
rate.limit.capacity=100
rate.limit.refill=100
rate.limit.duration=PT1M
# Token creation endpoints
rate.limit.token.capacity=10
rate.limit.token.refill=10
rate.limit.token.duration=PT1M
# Search endpoints
rate.limit.search.capacity=50
rate.limit.search.refill=50
rate.limit.search.duration=PT1M

# ---------- CORS / WebSocket origins (comma separated) ----------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5173,http://localhost:3000,https://localhost:3000,https://localhost}
websocket.allowed-origins=${cors.allowed-origins}

# ---------- Cache ----------
# "caffeine" (in-memory, default – no extra services needed) or "redis" (requires a Redis server)
spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=5m
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.enable-statistics=true

# ---------- Redis (only used when CACHE_TYPE=redis) ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# All repositories are MongoDB repositories; Redis is only used as a cache
spring.data.redis.repositories.enabled=false

# ---------- Actuator / monitoring ----------
management.endpoints.web.exposure.include=health,info,prometheus

# ---------- API docs (Swagger UI at /swagger-ui.html) ----------
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
management.prometheus.metrics.export.enabled=true
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# ---------- Notifications ----------
token.notification.before-minutes=5

# ---------- File upload ----------
file.upload-dir=${FILE_UPLOAD_DIR:uploads/}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ---------- Frontend URL (used in e-mail links) ----------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
